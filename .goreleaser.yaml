version: 2

builds:
  - main: ./cmd/testsplitter
    binary: testsplitter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/takuo/go-testsplitter/cmd/testsplitter/command.version={{ .Tag }}

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - README.ja.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
